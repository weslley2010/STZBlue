const norm=t=>String(t).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
function parseImp(t){const rows=[],fm={},err=[];let bm=0;
 t.split('\n').forEach(l=>{l=l.trim();if(!l)return;
  let m=l.match(/^(?:bim(?:estre)?\s*(\d)|(\d)\s*[ºo°]?\s*bim(?:estre)?)\s*:?$/i);
  if(m){bm=+(m[1]||m[2]);if(bm<1||bm>4)bm=0;return}
  m=l.match(/^formativa\s*:?\s*([\d.,]+)$/i);
  if(m){const v=num(m[1]);if(!bm||isNaN(v))err.push('Formativa ignorada: '+l);else fm[bm]=Math.min(10,v);return}
  const pr=l.split('|').map(x=>x.trim());if(pr.length<2||!bm||!pr[0]){err.push('Linha ignorada: '+l);return}
  const r={bm,n:pr[0].slice(0,60),a:null,p2:null,x:[]};
  pr.slice(1).forEach(f=>{const i=f.indexOf(':'),k=f.slice(0,i).trim(),v=num(f.slice(i+1)),kl=norm(k);
   if(i<1||isNaN(v)){err.push('Nota ignorada: '+f);return}const c=Math.min(10,Math.max(0,v));
   if(kl==='p1'||kl==='parcial')r.a=c;else if(kl==='p2'||kl==='bimestral')r.p2=c;else if(kl!=='formativa'&&kl!=='form')r.x.push({n:k.slice(0,30),v:c})});
  rows.push(r)});
 return{rows,fm,err}}

const preview=()=>`<div class="card"><h3>Conferir antes de importar</h3>${ip.rows.map(r=>`<div class="li"><span><b>${esc(r.n)}</b> <small>${r.bm}º bim${S.subs.some(s=>norm(s.n)===norm(r.n))?'':' · matéria nova'}</small></span><small>${[r.a!=null?'P1 '+f1(r.a):'',r.p2!=null?'P2 '+f1(r.p2):'',...r.x.map(z=>esc(z.n)+' +'+f1(z.v))].filter(Boolean).join(' · ')}</small></div>`).join('')}${Object.keys(ip.fm).map(b=>`<div class="li"><span>Formativa ${b}º bim</span><b>${f1(ip.fm[b])}</b></div>`).join('')}${ip.err.map(e=>`<div class="al warn">${esc(e)}</div>`).join('')}<div class="f"><button class="btn" onclick="aplicar()">Confirmar importação</button><button class="chip" onclick="ip=null;render()">Cancelar</button></div></div>`;
function conferir(){itx=V('#it2');ipol=V('#ipol');ip=parseImp(itx);imsg='';if(!ip.rows.length&&!Object.keys(ip.fm).length){imsg='<div class="al bad">Não encontrei notas nesse texto. Confira o formato do exemplo.</div>';ip=null}render()}
function aplicar(){const keep=ipol==='keep';let n=0;
 ip.rows.forEach(r=>{let s=S.subs.find(x=>norm(x.n)===norm(r.n));if(!s){s={id:uid(),n:r.n,pr:'',c:COL[S.subs.length%COL.length],g:{},at:{}};S.subs.push(s)}
  const o=s.g[r.bm]=s.g[r.bm]||{};
  [['a',r.a],['b',r.p2]].forEach(([k,v])=>{if(v!=null&&(!keep||o[k]==null)){o[k]=v;n++}});
  r.x.forEach(z=>{o.x=o.x||[];const i=o.x.findIndex(y=>norm(y.n)===norm(z.n));if(i<0){o.x.push(z);n++}else if(!keep){o.x[i].v=z.v;n++}})});
 Object.keys(ip.fm).forEach(b=>{if(!keep||S.fm[b]==null){S.fm[b]=ip.fm[b];n++}});
 save('a importação das notas');imsg=`<div class="al ok">Importado: ${n} nota(s) gravada(s). Veja no Boletim.</div>`;ip=null;itx='';render()}

function mergeState(local,remote){if(local==null)return remote;if(remote==null)return local;if(Array.isArray(local)&&Array.isArray(remote)){if(local.every(x=>x&&typeof x==='object'&&x.id)&&remote.every(x=>x&&typeof x==='object'&&x.id)){const m=new Map(remote.map(x=>[x.id,x]));local.forEach(x=>m.set(x.id,mergeState(x,m.get(x.id))));return [...m.values()]}return local.length?local:remote}if(typeof local==='object'&&typeof remote==='object'){const out={...remote,...local};for(const k of Object.keys(remote))if(k in local)out[k]=mergeState(local[k],remote[k]);return out}return local}
