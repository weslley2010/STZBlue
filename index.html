/* =========================================================
   STZBLUE — REFINAMENTO VISUAL GLOBAL
   Identidade azul preservada + acabamento mais moderno
   ========================================================= */
:root {
  --stz-blue-900: #04122b; --stz-blue-800: #071d3f; --stz-blue-700: #0b2a5b;
  --stz-blue-600: #12408a; --stz-blue-500: #1f63d6; --stz-blue-400: #3b82f6;
  --stz-blue-300: #7aa7ff; --stz-bg: #050b18;
  --stz-surface: rgba(10,22,45,.82); --stz-surface-strong: rgba(13,28,56,.95);
  --stz-border: rgba(94,141,255,.16); --stz-border-strong: rgba(94,141,255,.30);
  --stz-text: #eaf1ff; --stz-text-soft: #a9b8d4; --stz-text-muted: #74829d;
  --stz-success: #2ecc8f; --stz-warning: #ffb547; --stz-danger: #ff5d6c;
  --stz-radius-sm: 10px; --stz-radius: 16px; --stz-radius-lg: 22px;
  --stz-shadow-sm: 0 4px 14px rgba(0,0,0,.22); --stz-shadow: 0 14px 34px rgba(0,0,0,.28);
  --stz-glow: 0 0 0 1px rgba(59,130,246,.18), 0 10px 30px rgba(31,99,214,.16);
  --stz-ease: cubic-bezier(.22,.61,.36,1);
}
/* Mantém o seletor de tema existente funcional: o refinamento escuro aplica-se ao tema escuro. */
:root[data-theme="dark"] {
  --bg: var(--stz-bg); --card: var(--stz-surface-strong); --tx: var(--stz-text);
  --mut: var(--stz-text-soft); --br: var(--stz-border-strong); --ac: var(--stz-blue-400);
  --hd: var(--stz-blue-800); --tr: rgba(31,99,214,.14);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: var(--stz-bg); --card: var(--stz-surface-strong); --tx: var(--stz-text);
    --mut: var(--stz-text-soft); --br: var(--stz-border-strong); --ac: var(--stz-blue-400);
    --hd: var(--stz-blue-800); --tr: rgba(31,99,214,.14);
  }
}
body {
  background: radial-gradient(1100px 620px at 8% -8%,rgba(31,99,214,.18),transparent 60%),
    radial-gradient(900px 540px at 100% 0%,rgba(59,130,246,.12),transparent 55%),var(--bg);
  color: var(--tx); -webkit-font-smoothing: antialiased;
}
h1,h2,h3,h4 { letter-spacing: -.015em; line-height: 1.2; }
h1 { font-size: clamp(1.45rem,2vw,2rem); }
h2 { font-size: clamp(1.2rem,1.6vw,1.5rem); }
h3 { font-size: clamp(1.05rem,1.3vw,1.22rem); }
p,span,small,label,td,th { letter-spacing: .005em; }
.text-muted,.secondary-text,small { color: var(--mut); }
.card,.panel,.box,.stat-card,.metric-card,.info-card,.dashboard-card {
  position: relative; background: linear-gradient(160deg,var(--card),color-mix(in srgb,var(--card) 88%,var(--bg)));
  border: 1px solid var(--br); border-radius: var(--stz-radius-lg); box-shadow: var(--stz-shadow-sm);
  transition: border-color .25s var(--stz-ease),transform .25s var(--stz-ease),box-shadow .25s var(--stz-ease);
}
.card:hover,.panel:hover,.stat-card:hover,.metric-card:hover,.dashboard-card:hover {
  border-color: var(--stz-border-strong); box-shadow: var(--stz-glow),var(--stz-shadow-sm);
}
.card::before,.panel::before,.stat-card::before,.metric-card::before {
  content:""; position:absolute; inset:0 0 auto; height:1px; border-radius:inherit;
  background:linear-gradient(90deg,transparent,rgba(59,130,246,.42),transparent);
  opacity:.7; pointer-events:none;
}
.stat-value,.metric-value,.big-number,.important-number {
  font-weight:750; letter-spacing:-.03em; color:var(--tx); text-shadow:0 0 24px rgba(59,130,246,.16);
}
.stat-label,.metric-label { color:var(--mut); font-size:.82rem; text-transform:uppercase; letter-spacing:.08em; font-weight:600; }
button,.btn,.button,input[type="submit"] {
  border-radius:var(--stz-radius-sm); font-weight:650;
  transition:background .2s var(--stz-ease),border-color .2s var(--stz-ease),transform .15s var(--stz-ease),box-shadow .2s var(--stz-ease);
}
button:active,.btn:active,.button:active { transform:scale(.985); }
button:focus-visible,.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible {
  outline:2px solid rgba(59,130,246,.75); outline-offset:2px;
}
input,select,textarea {
  background:color-mix(in srgb,var(--bg) 72%,var(--card)); border-color:var(--br); border-radius:var(--stz-radius-sm);
  color:var(--tx); transition:border-color .2s var(--stz-ease),box-shadow .2s var(--stz-ease),background .2s var(--stz-ease);
}
input::placeholder,textarea::placeholder { color:var(--stz-text-muted); }
input:focus,select:focus,textarea:focus { background:var(--card); border-color:var(--ac); box-shadow:0 0 0 4px rgba(31,99,214,.14); }
table { border-collapse:separate; border-spacing:0; width:100%; }
th { color:var(--mut); font-size:.78rem; text-transform:uppercase; letter-spacing:.07em; font-weight:700; }
th,td { border-bottom:1px solid var(--br); }
tbody tr { transition:background .18s var(--stz-ease); }
tbody tr:hover { background:rgba(31,99,214,.08); }
tbody tr:last-child td { border-bottom:none; }
.dwp { background:var(--card); border-right:1px solid var(--br); }
.dwm button { transition:color .2s var(--stz-ease),background .2s var(--stz-ease),transform .2s var(--stz-ease); }
.dwm button:hover { color:var(--ac); background:var(--tr); }
.dwm button.on { color:var(--ac); background:var(--tr); }
header { backdrop-filter:blur(16px); }
.alert-success,.success { border-color:rgba(46,204,143,.35); background:rgba(46,204,143,.10); color:#d8ffef; }
.alert-warning,.warning { border-color:rgba(255,181,71,.35); background:rgba(255,181,71,.10); color:#ffe9c7; }
.alert-danger,.error,.danger { border-color:rgba(255,93,108,.35); background:rgba(255,93,108,.10); color:#ffd9dd; }
@keyframes stzFadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }
.card { animation:stzFadeUp .35s var(--stz-ease) both; }
@media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important;transition:none!important; } }
::-webkit-scrollbar { width:10px;height:10px; }
::-webkit-scrollbar-track { background:color-mix(in srgb,var(--bg) 85%,#000); }
::-webkit-scrollbar-thumb { background:linear-gradient(180deg,rgba(59,130,246,.55),rgba(31,99,214,.35));border-radius:99px;border:2px solid transparent;background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:linear-gradient(180deg,rgba(122,167,255,.75),rgba(59,130,246,.55));background-clip:content-box; }

  background:radial-gradient(90% 130% at 14% 30%,color-mix(in srgb,var(--mood) 17%,transparent),transparent 62%),radial-gradient(60% 90% at 100% 0%,color-mix(in srgb,var(--mood2) 8%,transparent),transparent 70%),linear-gradient(150deg,#090f2d,#0a1235 55%,#080d26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 22px 60px rgba(0,0,0,.30),0 0 46px color-mix(in srgb,var(--mood) 14%,transparent);
  transition:--mood .8s ease,--mood2 .8s ease,border-color .8s ease}

.dash-mascot[data-mood="mais-feliz"]{--mood:#7c8cff;--mood2:#b4bcff}

@media(max-width:899px){

:root{--v13-neon:#5b8cff;--v13-cyan:#5ad8ff;--v13-violet:#a78bfa;--v13-edge:rgba(160,190,255,.20);--v13-r-sm:14px;--v13-r-md:21px;--v13-r-lg:30px;--v13-ease:cubic-bezier(.23,1,.32,1);--v13-spring:cubic-bezier(.34,1.56,.64,1)}

/* ---- Animações globais desligadas (isolado do mascote) ---- */
html[data-motion="reduced"] *:not(.dash-mascot):not(.dash-mascot *),html[data-motion="reduced"] *::before,html[data-motion="reduced"] *::after{animation-duration:.001ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001ms!important;transition-delay:0s!important;scroll-behavior:auto!important}
html[data-motion="reduced"] .ambient-motion{display:none!important}
html[data-motion="reduced"] :is(.card,header,.stz-tbar,.mobile-bottom-nav-shell,.mdl){-webkit-backdrop-filter:none!important;backdrop-filter:none!important}

/* ---- Fundo vivo compartilhado (splash, boas-vindas, login) ---- */
.v13-mist{position:absolute;border-radius:50%;pointer-events:none;will-change:transform}
.v13-mist.m1{width:70vmax;height:70vmax;left:-20vmax;top:-30vmax;background:radial-gradient(closest-side,rgba(59,130,246,.34),transparent);animation:v13Mist 22s ease-in-out infinite alternate}
.v13-mist.m2{width:60vmax;height:60vmax;right:-22vmax;top:5vmax;background:radial-gradient(closest-side,rgba(139,92,246,.32),transparent);animation:v13Mist 26s ease-in-out -6s infinite alternate-reverse}
.v13-mist.m3{width:50vmax;height:50vmax;left:15vmax;bottom:-28vmax;background:radial-gradient(closest-side,rgba(56,189,248,.24),transparent);animation:v13Mist 30s ease-in-out -12s infinite alternate}
@keyframes v13Mist{from{transform:translate3d(-3vmax,-2vmax,0) scale(1)}to{transform:translate3d(5vmax,4vmax,0) scale(1.12)}}
.v13-waves{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%;pointer-events:none;overflow:hidden}
.v13-waves .wv{will-change:transform}
.v13-waves .w1{animation:v13Slide 26s linear infinite}.v13-waves .w2{animation:v13Slide 18s linear infinite reverse}.v13-waves .w3{animation:v13Slide 12s linear infinite}
@keyframes v13Slide{from{transform:translate3d(0,0,0)}to{transform:translate3d(-1200px,0,0)}}

/* ---- Abertura animada ---- */
.stz13-splash{position:fixed;inset:0;z-index:100000;overflow:hidden;display:grid;place-items:center;color:#fff;background:radial-gradient(120% 90% at 50% 38%,#10205a 0%,#070d28 58%,#04071a 100%);transition:opacity .6s ease,transform .65s cubic-bezier(.4,0,.2,1)}
.stz13-splash.is-out{opacity:0;transform:scale(1.04);pointer-events:none}
.sp-stage{position:relative;z-index:2;display:grid;justify-items:center;gap:12px;width:min(760px,90vw)}
.sp-logo{width:100%;height:auto;overflow:visible}
.sp-logo text{font:800 104px/1 'Plus Jakarta Sans',system-ui,sans-serif;letter-spacing:-2px}
.sp-halo{fill:none;stroke:#5b8cff;stroke-width:16;stroke-linejoin:round;opacity:0;animation:spHalo 6s ease both}
.sp-stroke{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:spDraw 2.1s cubic-bezier(.4,0,.2,1) .3s forwards}
.sp-clip{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:spReveal 1.7s cubic-bezier(.65,0,.35,1) 1.4s forwards}
.sp-tag{margin:0;opacity:0;transform:translateY(8px);font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#b8c8f5;animation:spTag .8s ease 3.2s forwards}
.sp-orbit{position:absolute;left:50%;top:44%;width:0;height:0;transform:scaleY(.34);opacity:0;animation:spFade 1s ease 1.2s forwards}
.sp-orbit i{position:absolute;left:0;top:0;width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:50%;background:#a8ccff;box-shadow:0 0 10px #5b8cff;animation:spOrbit var(--d) linear infinite;will-change:transform}
.sp-skip{position:absolute;z-index:3;left:50%;bottom:max(28px,env(safe-area-inset-bottom));transform:translateX(-50%);border:1px solid rgba(180,200,255,.25);background:rgba(255,255,255,.06);color:#c9d6f5;border-radius:999px;padding:8px 16px;font:600 12px inherit;opacity:0;pointer-events:none;transition:opacity .4s}
.stz13-splash.can-skip .sp-skip{opacity:.75}
@keyframes spDraw{to{stroke-dashoffset:0}}@keyframes spReveal{to{transform:scaleX(1)}}@keyframes spTag{to{opacity:1;transform:none}}@keyframes spFade{to{opacity:1}}
@keyframes spHalo{0%,32%{opacity:0}55%{opacity:.14}78%{opacity:.30}100%{opacity:.18}}
@keyframes spOrbit{from{transform:rotate(var(--a)) translateX(var(--r)) rotate(calc(-1*var(--a)))}to{transform:rotate(calc(var(--a) + 360deg)) translateX(var(--r)) rotate(calc(-1*(var(--a) + 360deg)))}}
.stz13-splash.is-calm .sp-stroke{animation:none;stroke-dashoffset:0}.stz13-splash.is-calm .sp-clip{animation:none;transform:none}.stz13-splash.is-calm .sp-tag{animation:none;opacity:1;transform:none}

/* ---- Boas-vindas (primeiro acesso) ---- */
.stz13-welcome{position:fixed;inset:0;z-index:99990;overflow:hidden;display:grid;place-items:center;text-align:center;cursor:pointer;color:#fff;background:radial-gradient(110% 90% at 50% 30%,#122468 0%,#080e2c 60%,#04071a 100%);transition:opacity .75s ease,transform .75s cubic-bezier(.4,0,.2,1);-webkit-tap-highlight-color:transparent}
.stz13-welcome.is-out{opacity:0;transform:scale(1.07);pointer-events:none}
.stz13-welcome:focus-visible{outline:2px solid #7cc4ff;outline-offset:-6px}
.wl-stage{position:relative;z-index:2;display:grid;justify-items:center;gap:10px;padding:24px;width:min(640px,100%)}
.wl-stage>*{opacity:0;transform:translateY(14px);animation:wlIn .85s var(--v13-ease) forwards}
.wl-face{width:min(340px,72vw);animation-delay:.1s!important}.wl-kicker{animation-delay:.35s!important}.wl-title{animation-delay:.5s!important}.wl-sub{animation-delay:.65s!important}.wl-hint{animation-delay:1s!important}
.wl-kicker{font-size:11px;font-weight:800;letter-spacing:.22em;color:#8fb4ff}
.wl-title{margin:0;font-size:clamp(32px,6.4vw,56px);line-height:1.05;letter-spacing:-.04em;font-weight:800}
.wl-title span{background:linear-gradient(90deg,#7cc4ff,#5b8cff 50%,#b08cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl-sub{margin:0;max-width:46ch;color:#b9c8ee;font-size:clamp(14px,2.2vw,17px);line-height:1.5}
.wl-hint{display:inline-flex;align-items:center;gap:10px;margin-top:18px;padding:10px 18px;border-radius:999px;border:1px solid rgba(160,190,255,.22);background:rgba(255,255,255,.05);font-size:13px;font-weight:600;color:#d7e2ff}
.wl-hint i{width:8px;height:8px;border-radius:50%;background:#7cc4ff;box-shadow:0 0 12px #7cc4ff;animation:wlPulse 1.8s ease-in-out infinite}
.wl-sparks{position:absolute;inset:0;pointer-events:none}
.wl-sparks i{position:absolute;left:var(--x);top:var(--y);width:var(--s);height:var(--s);border-radius:50%;background:#9cc4ff;box-shadow:0 0 9px #5b8cff;opacity:0;animation:wlSpark var(--d) ease-in-out var(--dl) infinite;will-change:transform,opacity}
@keyframes wlIn{to{opacity:1;transform:none}}@keyframes wlPulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes wlSpark{0%{opacity:0;transform:translate3d(0,10px,0)}40%{opacity:.9}100%{opacity:0;transform:translate3d(0,-30px,0)}}
body.stz13-welcoming{overflow:hidden}

/* ---- Login / Cadastro ---- */
html body.stz13-unauth{background:radial-gradient(120% 90% at 50% 0%,#102064 0%,#070d28 55%,#04071a 100%) fixed!important}
body.stz13-unauth .ambient-motion{display:none!important}
body.stz13-unauth header,body.stz13-unauth .mobile-bottom-nav{display:none!important}
body.stz13-unauth main{max-width:none;padding:0}
.a13{min-height:100dvh;display:grid;place-items:center;padding:clamp(12px,3vw,32px);color:#eef3ff}
.a13-shell{position:relative;display:grid;grid-template-columns:1fr 1fr;width:min(1000px,100%);min-height:620px;border-radius:34px;overflow:hidden;border:1px solid var(--v13-edge);background:rgba(8,13,36,.7);box-shadow:0 40px 100px rgba(0,0,0,.45),0 0 70px rgba(91,110,255,.16),inset 0 1px 0 rgba(255,255,255,.12)}
.a13-brand,.a13-panel{grid-row:1;transition:transform .75s cubic-bezier(.65,0,.35,1)}
.a13-brand{grid-column:1;position:relative;z-index:2;display:grid;align-content:center;justify-items:center;gap:10px;padding:34px;overflow:hidden;text-align:center;background:linear-gradient(150deg,#12286f,#2b1c7c 58%,#4b1f92)}
.a13-brand-bg{position:absolute;inset:0;pointer-events:none}
.a13-brand>*:not(.a13-brand-bg){position:relative;z-index:1}
.a13-panel{grid-column:2;position:relative;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:clamp(28px,4vw,52px);background:rgba(7,12,34,.78)}
.a13[data-side="right"] .a13-brand{transform:translateX(100%)}.a13[data-side="right"] .a13-panel{transform:translateX(-100%)}
.a13-wordmark{font-size:22px;font-weight:800;letter-spacing:.02em}.a13-wordmark span{color:#8fb4ff}
.a13-face{width:min(330px,86%)}
.a13-h{margin:6px 0 0;font-size:clamp(24px,2.6vw,32px);line-height:1.1;letter-spacing:-.03em;color:#fff;transition:opacity .2s}
.a13-p{margin:0;color:#c3d0f2;font-size:15px;max-width:30ch}
.a13-title{margin:0;font-size:clamp(26px,3vw,34px);letter-spacing:-.04em;color:#fff}
.a13-curve{display:none}
.a13-form{display:grid;gap:14px;transition:opacity .18s ease,transform .22s ease}
.a13-form.is-out{opacity:0;transform:translateX(14px)}.a13-form.is-in{animation:a13In .42s var(--v13-ease)}
@keyframes a13In{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
.a13 .a13-f{display:grid;gap:7px;margin:0;font-size:13px;font-weight:700;color:#a9b9e0}
.a13 .a13-f input{width:100%;height:52px;margin:0;padding:0 16px;border:1px solid rgba(150,180,255,.22);border-radius:18px;background:rgba(255,255,255,.055);color:#eef3ff;font:500 16px inherit;outline:0;box-shadow:none;transition:border-color .2s,box-shadow .2s,background-color .2s}
.a13 .a13-f input:focus{border-color:var(--v13-neon);background:rgba(255,255,255,.08);box-shadow:0 0 0 4px rgba(91,140,255,.22)}
.a13-pw{position:relative}.a13-pw input{padding-right:50px!important}
.a13-eye{all:unset;position:absolute;right:6px;top:50%;width:40px;height:40px;margin-top:-20px;display:grid;place-items:center;border-radius:50%;color:#a9b9e0;cursor:pointer;transition:background-color .2s,color .2s}
.a13-eye:hover{background:rgba(255,255,255,.08);color:#fff}.a13-eye:focus-visible{outline:2px solid var(--v13-neon)}.a13-eye[aria-pressed=true]{color:#7cc4ff}
.a13-msg{margin:0;border-radius:14px}
.a13-go{all:unset;box-sizing:border-box;display:grid;place-items:center;height:54px;border-radius:999px;cursor:pointer;color:#fff;font:800 16px 'Plus Jakarta Sans',system-ui,sans-serif;background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 14px 34px -10px rgba(91,110,255,.75),inset 0 1px 0 rgba(255,255,255,.38);transition:transform .2s var(--v13-ease),box-shadow .2s,filter .2s;-webkit-tap-highlight-color:transparent}
.a13-go:active{transform:scale(.98)}.a13-go:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(hover:hover) and (pointer:fine){.a13-go:hover{transform:translateY(-2px);filter:brightness(1.08)}}
.a13-alt{display:grid;gap:10px;justify-items:start;font-size:13px;color:#a9b9e0}.a13-sw{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.a13-link{all:unset;cursor:pointer;color:#8fb4ff;font-weight:700;border-radius:8px;padding:2px 4px}.a13-link.strong{color:#fff}.a13-link:hover{text-decoration:underline}.a13-link:focus-visible{outline:2px solid var(--v13-neon)}
.a13-shake{animation:a13Shake .5s}
@keyframes a13Shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media(max-width:899px){
  .a13{place-items:start center;padding:0}
  .a13-shell{display:flex;flex-direction:column;width:min(460px,100%);min-height:100dvh;border-radius:0;border:0;background:#070c22;box-shadow:none}
  .a13[data-side="right"] .a13-brand,.a13[data-side="right"] .a13-panel{transform:none}
  .a13-brand{padding:max(22px,env(safe-area-inset-top)) 20px 64px;gap:6px;border-radius:0 0 46px 46px/0 0 38px 38px;flex:0 0 auto}
  .a13-face{width:min(220px,62%)}.a13-h{font-size:22px;margin-top:2px}.a13-p{font-size:13px}
  .a13-panel{flex:1;margin-top:-34px;border-radius:30px 30px 0 0;padding:26px 22px max(28px,env(safe-area-inset-bottom));background:rgba(9,14,40,.96);border-top:1px solid var(--v13-edge)}
  .a13-title{font-size:26px}
}
@media(max-width:899px) and (min-width:520px){.a13{place-items:center;padding:20px}.a13-shell{min-height:0;border-radius:36px;border:1px solid var(--v13-edge)}}

/* ---- Nome de usuário ---- */
.stz13-uname .u13-row{align-items:center;gap:10px;margin-top:10px}
.u13-field{display:flex;align-items:center;gap:8px;flex:1 1 220px;min-width:0;padding:0 14px;border:1px solid var(--br);border-radius:var(--v13-r-sm);background:rgba(255,255,255,.04);transition:border-color .2s,box-shadow .2s}
.u13-field:focus-within{border-color:var(--v13-neon);box-shadow:0 0 0 3px rgba(91,140,255,.2)}
.u13-field span{color:var(--mut);font-weight:800}
.u13-field input{flex:1;min-width:0;height:46px;margin:0;padding:0;border:0;background:transparent;box-shadow:none;outline:0;color:inherit;font:inherit}
.u13-msg{min-height:1.4em;margin-top:8px;font-size:13px;color:var(--mut)}.u13-msg[data-k=ok]{color:var(--ok)}.u13-msg[data-k=bad]{color:var(--bad)}

/* ---- Janela de novidades v1.3 ---- */
.stz13-rel-ov{position:fixed;inset:0;z-index:99980;display:grid;place-items:center;padding:16px;background:rgba(3,6,20,.62);animation:relFade .3s ease both}
.stz13-rel{position:relative;width:min(520px,100%);max-height:min(88dvh,740px);overflow:auto;overscroll-behavior:contain;border-radius:30px;padding:24px 20px 18px;color:#eef3ff;background:linear-gradient(160deg,rgba(26,38,92,.94),rgba(13,17,50,.96));border:1px solid rgba(150,180,255,.26);box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 60px rgba(91,110,255,.22),inset 0 1px 0 rgba(255,255,255,.14);animation:relIn .8s var(--v13-spring) both}
.stz13-rel::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg,#5b8cff,transparent 42%,#a78bfa);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.85}
.rel-glow{position:absolute;left:50%;top:-70px;width:320px;height:200px;margin-left:-160px;background:radial-gradient(closest-side,rgba(110,130,255,.45),transparent);pointer-events:none;animation:relPulse 3.2s ease-in-out infinite}
.rel-x{position:absolute;z-index:2;right:12px;top:12px;width:38px;height:38px;border:1px solid rgba(160,190,255,.22);border-radius:50%;background:rgba(255,255,255,.06);color:#dfe8ff;font-size:22px;line-height:1;cursor:pointer;transition:transform .2s var(--v13-ease),background-color .2s}
.rel-x:hover{background:rgba(255,255,255,.12)}.rel-x:active{transform:scale(.92)}
.rel-top{position:relative;text-align:center;padding:4px 30px 14px}
.rel-badge{display:inline-block;padding:6px 14px;border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.16em;color:#fff;background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 8px 22px -8px rgba(91,110,255,.8),inset 0 1px 0 rgba(255,255,255,.4)}
.rel-top h2{margin:12px 0 4px;font-size:clamp(24px,5vw,30px);letter-spacing:-.04em;color:#fff}.rel-top p{margin:0;color:#b9c8ee;font-size:14px}
.rel-list{position:relative;list-style:none;margin:6px 0 14px;padding:0;display:grid;gap:8px}
.rel-list li{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid rgba(160,190,255,.14);border-radius:18px;background:rgba(255,255,255,.04);opacity:0;transform:translateY(10px) scale(.98);animation:relItem .55s var(--v13-ease) forwards;animation-delay:calc(var(--i)*70ms + 420ms)}
.rel-ic{flex:0 0 38px;width:38px;height:38px;display:grid;place-items:center;border-radius:12px;color:#9cc4ff;background:linear-gradient(135deg,rgba(91,140,255,.22),rgba(167,139,250,.18));border:1px solid rgba(160,190,255,.2)}
.rel-list b{display:block;font-size:14px;color:#fff;line-height:1.3}.rel-list p{margin:2px 0 0;font-size:12.5px;line-height:1.45;color:#aebcdf}
.rel-ok{all:unset;box-sizing:border-box;display:grid;place-items:center;width:100%;height:50px;border-radius:999px;cursor:pointer;color:#fff;font:800 15px 'Plus Jakarta Sans',system-ui,sans-serif;background:linear-gradient(135deg,#3b82f6,#8b5cf6);box-shadow:0 14px 34px -10px rgba(91,110,255,.75),inset 0 1px 0 rgba(255,255,255,.38);transition:transform .2s var(--v13-ease);-webkit-tap-highlight-color:transparent}
.rel-ok:active{transform:scale(.98)}.rel-ok:focus-visible{outline:2px solid #fff;outline-offset:3px}
@keyframes relFade{from{opacity:0}to{opacity:1}}
@keyframes relIn{0%{opacity:0;transform:translateY(34px) scale(.86)}100%{opacity:1;transform:none}}
@keyframes relItem{to{opacity:1;transform:none}}@keyframes relPulse{0%,100%{opacity:.6}50%{opacity:1}}

/* ---- Painel: Visão Geral sem Média/Frequência repetidas ---- */
.dash-overview .dash-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}

/* ---- Barra lateral (desktop): transparência + neon ---- */
@media(min-width:1100px){
  .stz-tbar{background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.018) 40%,rgba(91,110,255,.06)),rgba(9,14,38,.58);border-color:rgba(160,190,255,.20);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 0 0 1px rgba(91,140,255,.05),0 16px 50px rgba(0,0,0,.34),0 0 40px rgba(91,110,255,.10)}
  .sidebar-toggle{border-radius:15px;background:rgba(255,255,255,.06);transition:background-color .22s,border-color .22s,transform .25s var(--v13-ease),box-shadow .25s}
  .sidebar-toggle:hover{border-color:rgba(124,196,255,.6);box-shadow:0 0 18px rgba(91,140,255,.35)}.sidebar-toggle:active{transform:scale(.94)}
  .tb-tabs button{border-radius:15px}
  .tb-tabs button>.ic{transition:transform .28s var(--v13-ease),color .2s,filter .2s}
  .tb-tabs button:not(.on):hover{background:linear-gradient(90deg,rgba(91,140,255,.16),rgba(91,140,255,.02))}
  .tb-tabs button:not(.on):hover>.ic{transform:scale(1.12) translateX(1px);color:#9cc4ff;filter:drop-shadow(0 0 6px rgba(124,196,255,.55))}
  .tb-tabs button.on::after{content:"";position:absolute;left:1px;top:11px;bottom:11px;width:3px;border-radius:3px;background:linear-gradient(#7cc4ff,#a78bfa);box-shadow:0 0 10px #7cc4ff}
  .tb-tabs button.on>.ic{filter:drop-shadow(0 0 7px rgba(190,220,255,.7))}
  body.stz-sidebar-expanded .tb-tabs button:nth-child(1) .tb-label{transition-delay:.02s}body.stz-sidebar-expanded .tb-tabs button:nth-child(2) .tb-label{transition-delay:.04s}body.stz-sidebar-expanded .tb-tabs button:nth-child(3) .tb-label{transition-delay:.06s}body.stz-sidebar-expanded .tb-tabs button:nth-child(4) .tb-label{transition-delay:.08s}body.stz-sidebar-expanded .tb-tabs button:nth-child(5) .tb-label{transition-delay:.10s}body.stz-sidebar-expanded .tb-tabs button:nth-child(6) .tb-label{transition-delay:.12s}body.stz-sidebar-expanded .tb-tabs button:nth-child(7) .tb-label{transition-delay:.14s}body.stz-sidebar-expanded .tb-tabs button:nth-child(8) .tb-label{transition-delay:.16s}body.stz-sidebar-expanded .tb-tabs button:nth-child(n+9) .tb-label{transition-delay:.18s}
}

/* ---- Design System: botões, chips, campos e foco unificados ---- */
:where(#app) :is(input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=file]),select,textarea):focus-visible{outline:0;border-color:var(--v13-neon)!important;box-shadow:0 0 0 3px rgba(91,140,255,.22)}
:where(#app) :is(button,.btn,.chip,a.btn):focus-visible{outline:2px solid var(--v13-neon);outline-offset:2px}
#app .btn{border-radius:999px;transition:transform .2s var(--v13-ease),filter .2s,box-shadow .2s}
#app .btn:active,#app .chip:active{transform:scale(.97)}
#app .chip{transition:transform .2s var(--v13-ease),background-color .2s,border-color .2s,filter .2s}
.dc-hero .dc-hic{color:var(--v13-cyan);filter:drop-shadow(0 0 10px rgba(90,216,255,.5))}

/* ---- Mobile: overflow de texto, tabelas e linhas ---- */

  #app{overflow-wrap:anywhere}

function parseImp(t){const rows=[],fm={},err=[];let bm=0;

  let m=l.match(/^(?:bim(?:estre)?\s*(\d)|(\d)\s*[ºo°]?\s*bim(?:estre)?)\s*:?$/i);

  if(m){const v=num(m[1]);if(!bm||isNaN(v))err.push('Formativa ignorada: '+l);else fm[bm]=Math.min(10,v);return}
  const pr=l.split('|').map(x=>x.trim());if(pr.length<2||!bm||!pr[0]){err.push('Linha ignorada: '+l);return}

  pr.slice(1).forEach(f=>{const i=f.indexOf(':'),k=f.slice(0,i).trim(),v=num(f.slice(i+1)),kl=norm(k);
